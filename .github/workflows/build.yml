name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
      
      - run: cd flutter_app && flutter clean
      
      - run: cd flutter_app && flutter pub get
      
      - run: cd flutter_app && flutter build apk --release 2>&1 | tail -20
      
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: app-release-apk
          path: flutter_app/build/app/outputs/flutter-app/release/app-release.apk
          if-no-files-found: ignore

