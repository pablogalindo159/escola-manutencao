name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      
      - name: Show Flutter info
        run: |
          flutter --version
          flutter doctor -v
      
      - name: Get dependencies
        run: cd flutter_app && flutter pub get --verbose
      
      - name: Build APK
        run: cd flutter_app && flutter build apk --release -v 2>&1 | grep -E "error|Error|ERROR|APK|apk|success|Success" || true
      
      - name: Check if APK exists
        run: |
          if [ -f flutter_app/build/app/outputs/flutter-app/release/app-release.apk ]; then
            echo "✅ APK FOUND!"
            ls -lh flutter_app/build/app/outputs/flutter-app/release/app-release.apk
          else
            echo "❌ APK NOT FOUND"
            find flutter_app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flutter_app/build/app/outputs/flutter-app/release/app-release.apk
          if-no-files-found: warn

