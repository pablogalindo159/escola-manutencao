name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa Android (se faltar)
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.escoladamanutencao .

      - name: Adicionar permissão INTERNET ao AndroidManifest.xml
        working-directory: flutter_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "✓ Permissão INTERNET já existe"
          else
            echo "✗ Adicionando permissão INTERNET..."
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
            echo "✓ Permissão INTERNET adicionada"
          fi
          echo "=== AndroidManifest.xml (primeiras 15 linhas) ==="
          head -15 "$MANIFEST"

      - name: Adicionar <queries> https ao AndroidManifest.xml (permite abrir Mercado Pago/YouTube/links)
        working-directory: flutter_app
        run: |
          python3 - << 'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          intent = ('        <intent>\n'
                    '            <action android:name="android.intent.action.VIEW" />\n'
                    '            <data android:scheme="https" />\n'
                    '        </intent>\n')
          if 'android:scheme="https"' in s:
              print("OK: intent https ja existe")
          elif "<queries>" in s:
              s = s.replace("<queries>\n", "<queries>\n" + intent, 1)
              print("OK: intent https inserido no <queries> existente")
          else:
              s = s.replace("</manifest>", "    <queries>\n" + intent + "    </queries>\n</manifest>", 1)
              print("OK: bloco <queries> criado")
          open(p, "w").write(s)
          assert 'android:scheme="https"' in open(p).read(), "falhou ao inserir intent https"
          EOF
          echo "=== AndroidManifest.xml completo ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        working-directory: flutter_app
        run: flutter pub get

      - name: Analisar código (não bloqueia o build)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilar APK (release)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Enviar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: escola-manutencao-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
