name: Build APK Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      
      - name: Get dependencies
        run: |
          cd flutter_app
          flutter clean
          flutter pub get
      
      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --release
      
      - name: Build AppBundle
        run: |
          cd flutter_app
          flutter build appbundle --release
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            flutter_app/build/app/outputs/flutter-app/release/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
          body: |
            # Escola da Manutenção - v${{ github.ref_name }}
            
            ## 🎉 Nova Release com Webhook Mercado Pago Orders API!
            
            ### ✅ O que é novo:
            - Webhook HMAC validando corretamente (Order ID lowercase)
            - Status mapeando perfeitamente (processed → approved)
            - Usuário adicionado automaticamente ao curso
            - Acesso liberado após pagamento
            
            ### 📦 Downloads:
            - **APK (Android):** `app-release.apk` - Instale direto no telefone
            - **AAB (Google Play):** `app-release.aab` - Para Google Play Store
            
            ### 📝 Notas:
            - Versão: v1.0.24+24
            - Webhook testado com pagamento real PIX ✅
            - Pronto para produção!
            
            ### 🚀 Como instalar:
            1. Baixar `app-release.apk`
            2. Copiar para telefone
            3. Abrir com gerenciador de arquivos
            4. Instalar
            
            ### 📤 Para Google Play:
            1. Upload `app-release.aab` no Google Play Console
            2. Adicionar notas de release
            3. Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

