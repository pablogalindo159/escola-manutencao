name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa Android (se faltar)
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.escoladamanutencao .

      - name: Permitir conexão HTTP com a VPS (sem SSL ainda)
        working-directory: flutter_app
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          XMLEOF

          python3 - << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          content = open(path).read()
          assert "<application" in content, "Tag <application> nao encontrada no manifest"
          content = content.replace(
              "<application",
              '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"',
              1,
          )
          open(path, "w").write(content)
          PYEOF

          echo "===== AndroidManifest.xml final ====="
          cat "$MANIFEST"
          echo "======================================"

          if ! grep -q 'usesCleartextTraffic="true"' "$MANIFEST"; then
            echo "ERRO: nao conseguiu aplicar usesCleartextTraffic no AndroidManifest.xml"
            exit 1
          fi
          echo "OK: cleartext HTTP liberado no manifest"

      - name: Instalar dependências
        working-directory: flutter_app
        run: flutter pub get

      - name: Analisar código (não bloqueia o build)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilar APK (release)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Enviar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: escola-manutencao-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
