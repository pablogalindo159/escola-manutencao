name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar estrutura nativa Android (se faltar)
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.escoladamanutencao .

      - name: Permitir conexão HTTP com a VPS (sem SSL ainda)
        working-directory: flutter_app
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">198.199.64.162</domain>
              </domain-config>
          </network-security-config>
          EOF
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config"#' android/app/src/main/AndroidManifest.xml
          grep -o '<application[^>]*>' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        working-directory: flutter_app
        run: flutter pub get

      - name: Analisar código (não bloqueia o build)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Compilar APK (release)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Enviar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: escola-manutencao-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
