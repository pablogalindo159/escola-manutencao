name: CI/CD Pipeline - Escola da Manutenção

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1️⃣ Testes PHP Laravel
  test-backend:
    name: Test Backend (PHP 8.2)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: escola_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, redis, gd, zip
          coverage: xdebug

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --env=testing
        env:
          DB_HOST: localhost
          DB_DATABASE: escola_test
          DB_USERNAME: app
          DB_PASSWORD: password

      - name: Execute tests
        run: php artisan test --coverage --coverage-html=coverage
        env:
          DB_HOST: localhost
          DB_DATABASE: escola_test
          DB_USERNAME: app
          DB_PASSWORD: password

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Code quality (PHPStan)
        run: ./vendor/bin/phpstan analyse app --level=8

      - name: Code style (Laravel Pint)
        run: ./vendor/bin/pint --test

  # 2️⃣ Testes Flutter
  test-flutter:
    name: Test Flutter App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.x'

      - name: Get dependencies
        run: cd flutter_app && flutter pub get

      - name: Run tests
        run: cd flutter_app && flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./flutter_app/coverage/lcov.info

  # 3️⃣ Testes E2E
  test-e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cypress
        run: npm install -g cypress

      - name: Run E2E tests
        uses: cypress-io/github-action@v5
        with:
          browser: chrome
          headless: true
          record: false

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  # 4️⃣ Build Docker Image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-flutter]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 5️⃣ Deploy para Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [test-backend, test-flutter, test-e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            cd /var/www/escola-staging
            git fetch origin
            git checkout develop
            git pull origin develop
            
            # Backend
            composer install --no-dev
            php artisan migrate --force
            php artisan cache:clear
            php artisan config:cache
            
            # Restart services
            sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx

      - name: Slack notification (Staging)
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Deploy Staging",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deploy staging bem-sucedido\n*Branch:* develop\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }

  # 6️⃣ Deploy para Produção
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-flutter, test-e2e, build-docker]
    environment:
      name: production
      url: https://api.escoladamanutencao.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            # Backup antes de deploy
            /usr/local/bin/backup-escola.sh
            
            cd /var/www/escola-manutencao-backend
            git fetch origin
            git checkout main
            git pull origin main
            
            # Backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            
            # Restart services
            sudo systemctl reload php8.2-fpm
            sudo systemctl reload nginx
            
            # Health check
            curl -f https://api.escoladamanutencao.com.br/health || exit 1

      - name: Database health check
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            'php artisan tinker << EOF
              exit(DB::table("users")->count() > 0 ? 0 : 1);
            EOF'

      - name: Slack notification (Production)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Deploy Produção",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deploy produção bem-sucedido 🚀\n*Branch:* main\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }

      - name: Slack notification (Failed)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Deploy Produção Falhou",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deploy produção falhou ⚠️\n*Branch:* main\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }

  # 7️⃣ Renovar SSL (mensal)
  renew-ssl:
    name: Renew SSL Certificates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Renew Let's Encrypt certificates
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            sudo certbot renew --quiet
            sudo systemctl reload nginx
