name: Release Manual

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - name: Install dependencies
        run: |
          cd flutter_app
          flutter clean
          flutter pub get
      
      - name: Build APK Release
        run: |
          cd flutter_app
          flutter build apk --release --no-pub
      
      - name: Build AAB Release
        run: |
          cd flutter_app
          flutter build appbundle --release --no-pub
      
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            flutter_app/build/app/outputs/flutter-app/release/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
          body: |
            Escola da Manutenção v${{ github.ref_name }}
            
            ✅ Webhook Mercado Pago Orders API 100% funcional
            ✅ PIX Transparente testado com pagamento real
            ✅ Status mapping correto
            ✅ Usuário adicionado ao curso automaticamente
            
            📥 Downloads:
            - app-release.apk → Instale no telefone
            - app-release.aab → Google Play Store

