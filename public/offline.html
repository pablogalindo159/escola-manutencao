<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0066FF">
  <title>Sem conexão - Escola da Manutenção</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f3f4f6; color: #1f2937; }
    .card { background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 340px; margin: 16px; text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b7280; line-height: 1.5; margin: 0 0 20px; }
    button { background: #0066FF; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>Verifique sua conexão para continuar assistindo às aulas.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
