name: escola_manutencao
description: "App de cursos de manutenção - Escola da Manutenção"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão do Material Design
  cupertino_icons: ^1.0.6

  # Autenticação & Segurança
  flutter_secure_storage: ^9.0.0

  # API & Requisições
  http: ^1.1.0
  dio: ^5.4.0

  # Logs
  logger: ^2.0.0

  # State Management
  provider: ^6.0.0

  # UI
  cached_network_image: ^3.3.0

  # Vídeo
  video_player: ^2.8.0
  chewie: ^1.7.0

  # Câmera/Galeria
  image_picker: ^1.0.7

  # Data & Hora
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
