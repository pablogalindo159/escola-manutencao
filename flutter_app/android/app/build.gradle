// android/app/build.gradle - Configuração otimizada para BUILD (local e GitHub Actions)

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.escoladamanutencao.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 24
        versionName "1.0.24"

        // MultiDex support para APK grande
        multiDexEnabled true
    }

    // Signing configuration - OPTIONAL (só se tiver keystore)
    signingConfigs {
        // Default debug config (usado se keystore não existir)
        debug {
            storeFile file("${android.buildDir}/../debug.keystore")
        }
        
        // Release config - ONLY if keystore exists
        release {
            def keystorePath = "${System.properties['user.home']}/.android/escola_keystore.jks"
            def keystoreFile = file(keystorePath)
            
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            } else {
                // Fallback: usar debug keystore
                storeFile file("${android.buildDir}/../debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Rename output APK
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "app-release.apk"
                }
            }
        }
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError false
        disable 'MissingTranslation'
    }
}

dependencies {
    // Implementação de dependências Flutter
    implementation 'androidx.multidex:multidex:2.0.1'
}
