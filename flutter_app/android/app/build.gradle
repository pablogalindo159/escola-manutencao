// android/app/build.gradle - Seções importantes para RELEASE BUILD

android {
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.escoladamanutencao.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        // MultiDex support
        multiDexEnabled true
    }

    // Signing configuration para RELEASE
    signingConfigs {
        release {
            storeFile file("${System.properties['user.home']}/.android/escola_keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Build variants
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "EscolaManutencao-${variant.versionName}-${variant.buildType.name}.apk"
                }
            }
        }
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }

        prod {
            dimension "default"
            // Production flavor
        }
    }
}

dependencies {
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Mercado Pago
    implementation 'com.mercadopago:sdk:5.25.0'

    // Image handling
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Serialization
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Otimização para release
android {
    lintOptions {
        checkReleaseBuilds true
        abortOnError false
        disable 'MissingTranslation'
    }
}
